    // Normalizar URLs onde o query parameter foi colocado acidentalmente após o hash
    // Ex: /embed/123#color:fb542b?player=vidstack -> /embed/123?player=vidstack#color:fb542b
    if (window.location.hash.includes('?player=') || window.location.hash.includes('&player=')) {
        var _hash = window.location.hash;
        var _match = _hash.match(/[?&]player=([^&]+)/);
        if (_match) {
            var _newHash = _hash.replace(_match[0], '');
            var _url = new URL(window.location.href);
            _url.hash = _newHash;
            _url.searchParams.set('player', _match[1]);
            window.location.replace(_url.href);
        }
    }
  </script>
  <script>
    // Detecção ativa de Sandbox (iframe restritivo) e Bloqueio de Anúncios/JS em WebViews Android
    (function() {
      var isSandboxed = false;
      var isWebView = /wv|Android.*Version\/[0-9.]+/i.test(navigator.userAgent) || navigator.userAgent.includes('Version/4.0');
      
      try {
        var storage = window.localStorage;
        if (!storage) isSandboxed = true;
      } catch (e) {
        isSandboxed = true; // Falha no storage = sandbox sem allow-same-origin
      }
      
      if (window.origin === 'null' || window.origin === 'about:srcdoc') {
        isSandboxed = true; // Origem opaca = sandbox
      }

      try {
        var _docDomain = document.domain;
        document.domain = _docDomain;
      } catch (e) {
        if (e.name === 'SecurityError' && e.message && e.message.toLowerCase().indexOf('sandbox') !== -1) {
            isSandboxed = true;
        }
      }

      if (isSandboxed) {
        window.location.href = "https://mgeb.top/app/sandbox.php?type=" + (isWebView ? "webview" : "sandbox");
        return;
      }

      // Se for rodado dentro de uma WebView Android, adiciona detector contra AdBlockers/bloqueadores de JS
      if (isWebView) {
        window.addEventListener('DOMContentLoaded', function() {
          var testAd = document.createElement('div');
          testAd.innerHTML = '&nbsp;';
          testAd.className = 'adsbox ad-banner ad-placement adsbygoogle';
          testAd.style.position = 'absolute';
          testAd.style.left = '-9999px';
          testAd.style.top = '-9999px';
          document.body.appendChild(testAd);
          
          window.setTimeout(function() {
            var isAdBlocked = (testAd.offsetHeight === 0 || testAd.offsetParent === null);
            document.body.removeChild(testAd);
            if (isAdBlocked) {

        });
